name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: |
          # Fail on real errors; treat style issues as warnings only.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.venv,.venv_test,venv,build,dist
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 \
            --statistics --exclude=.venv,.venv_test,venv,build,dist

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-security-lab:ci .
